name: CoinMarketCap self-healing check

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coinmarketcap:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MLX-LM
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install mlx-lm

      - name: Start MLX-LM server
        env:
          MLX_MODEL: mlx-community/Qwen3-8B-4bit
        run: |
          .venv/bin/mlx_lm.server --model "$MLX_MODEL" --port 8080 > mlx-server.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/v1/models > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          cat mlx-server.log
          exit 1

      - name: Run self-healing CoinMarketCap check
        env:
          AGENT_PROVIDER: mlx
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          COINMARKETCAP_BASE_URL: https://pro-api.coinmarketcap.com
          MLX_MODEL: mlx-community/Qwen3-8B-4bit
          MLX_BASE_URL: http://127.0.0.1:8080/v1
        run: npm run agent -- "Run the CoinMarketCap test and adjust only failed Bitcoin or Ethereum price ranges if needed, preserving each range width. Rerun the test to verify healing."

      - name: Commit healed threshold
        run: |
          if git diff --quiet -- spec/coinmarketcap-api.spec.ts; then
            echo "No threshold update needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spec/coinmarketcap-api.spec.ts
          git commit -m "chore: heal CoinMarketCap thresholds"
          git push